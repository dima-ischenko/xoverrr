name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Publish only from main."
            exit 1
          fi

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import pathlib
          import re
          import sys

          tag = __import__('os').environ['TAG_NAME']
          if not tag.startswith('v'):
              sys.exit(f'Tag must start with v, got {tag!r}')
          expected = tag[1:]

          pyproject = pathlib.Path('pyproject.toml').read_text()
          code = pathlib.Path('src/xoverrr/version.py').read_text()
          py_match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, re.M)
          code_match = re.search(r"^__version__\s*=\s*'([^']+)'", code, re.M)
          if not py_match or not code_match:
              sys.exit('Could not read version from pyproject.toml or version.py')

          py_version = py_match.group(1)
          code_version = code_match.group(1)
          if py_version != expected or code_version != expected:
              sys.exit(
                  'Version mismatch: '
                  f'tag={expected} pyproject={py_version} version.py={code_version}'
              )
          print(f'Version {expected} matches tag, pyproject.toml, and version.py')
          PY

  unit:
    name: Unit tests
    needs: guard
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  integration:
    name: Integration tests
    needs: guard
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read

  build:
    name: Build package
    needs:
      - unit
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          make build

      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/xoverrr
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
